				"    if [ \"$CONFIGURATION\" = \"Release\" ]; then",
				"        echo \"error: LookInside-MCP not present; Release builds must embed the MCP server binary\"",
				"        exit 1",
				"    fi",
				"    echo \"Skipping Embed MCP CLI: LookInside-MCP not present (not in monorepo checkout)\"",
				"    exit 0",
				"fi",
				"PREPARE_SCRIPT=\"$SRCROOT/Scripts/prepare-mcp-cli.sh\"",
				"# Run in a fresh login zsh so xcodebuild env from the host build does not leak",
				"# into the nested SwiftPM build (would crash XCBBuildService).",
				"# Re-export the host's BUILT_PRODUCTS_DIR / CONTENTS_FOLDER_PATH / CONFIGURATION",
				"# so the nested zsh can locate the LookInside.app bundle to embed into.",
				"env -i HOME=\"$HOME\" USER=\"$USER\" TERM=\"${TERM:-dumb}\" \\",
				"    GITHUB_TOKEN=\"${GITHUB_TOKEN:-}\" \\",
				"    CONFIGURATION=\"$CONFIGURATION\" \\",
