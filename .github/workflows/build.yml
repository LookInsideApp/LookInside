name: Build Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Validate Release Workflow
        run: bash Scripts/test-release-workflow.sh

      - name: Sync Derived Source
        run: bash Scripts/sync-derived-source.sh

      # The package only mirrors LookinCore for the app (the Server is built
      # and published from LookInside-Server).
      - name: Build SwiftPM Products
        run: swift build -c debug --product LookinShared

  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Private Key Scanner
        run: bash Scripts/test-scan-private-keys.sh

      - name: Scan Repository For Secrets
        run: bash Scripts/run-gitleaks.sh .
