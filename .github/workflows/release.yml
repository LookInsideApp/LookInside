name: Release
run-name: ${{ github.event.client_payload.release_id }}

on:
  repository_dispatch:
    types:
      - parent-app-release

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == 'Lakr233'
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.context.outputs.build_version }}
      build_number: ${{ steps.context.outputs.build_number }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      source_ref: ${{ steps.context.outputs.source_ref }}
      injector_ref: ${{ steps.context.outputs.injector_ref }}
      mcp_ref: ${{ steps.context.outputs.mcp_ref }}

    steps:
      - name: Validate Trigger Actor
        run: |
          if [[ "${GITHUB_ACTOR}" != "Lakr233" ]]; then
            echo "Only Lakr233 may run the Release workflow." >&2
            exit 1
          fi

      - name: Resolve Build Context
        id: context
        run: |
          set -euo pipefail
          VERSION="${{ github.event.client_payload.version }}"
          BUILD_NUMBER="${{ github.event.client_payload.build_number }}"
          SOURCE_REF="${{ github.event.client_payload.source_ref }}"
          INJECTOR_REF="${{ github.event.client_payload.injector_ref }}"
          MCP_REF="${{ github.event.client_payload.mcp_ref }}"
          RELEASE_REF="${{ github.event.client_payload.release_ref }}"
          PARENT_REPOSITORY="${{ github.event.client_payload.parent_repository }}"
          PARENT_REF="${{ github.event.client_payload.parent_ref }}"
          PARENT_SHA="${{ github.event.client_payload.parent_sha }}"
          RELEASE_ID="${{ github.event.client_payload.release_id }}"

          [[ "$PARENT_REPOSITORY" == "LookInsideApp/LookInside-MonoRepo" ]] || {
            echo "Release must be dispatched by the LookInside parent ledger." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release version must be canonical X.Y.Z SemVer without leading zeroes." >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid parent-resolved Xcode build number." >&2; exit 1; }
          [[ "$PARENT_REF" == "refs/tags/release/app/$VERSION" ]] || {
            echo "Parent ref does not match the app release version." >&2
            exit 1
          }
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid parent SHA." >&2; exit 1; }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Host source SHA." >&2; exit 1; }
          [[ "$INJECTOR_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Injector source SHA." >&2; exit 1; }
          [[ "$MCP_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid MCP source SHA." >&2; exit 1; }
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Release source SHA." >&2; exit 1; }
          [[ "$RELEASE_ID" == "release/app/$VERSION@$PARENT_SHA/host" ]] || {
            echo "Release id does not identify the parent tag and commit." >&2
            exit 1
          }

          echo "Using parent-resolved Xcode version ${VERSION} (${BUILD_NUMBER})."
          {
            echo "build_number=${BUILD_NUMBER}"
            echo "build_version=${VERSION}"
            echo "artifact_name=LookInside-${VERSION}-release"
            echo "source_ref=${SOURCE_REF}"
            echo "injector_ref=${INJECTOR_REF}"
            echo "mcp_ref=${MCP_REF}"
          } >>"${GITHUB_OUTPUT}"

  build_package:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: "Never"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Scan Repository For Secrets
        run: bash Scripts/run-gitleaks.sh .

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Install mise
        run: brew install mise

      - name: Validate Sparkle Public Key
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            echo "SPARKLE_PUBLIC_ED_KEY secret is required for release builds." >&2
            exit 1
          fi

      - name: Checkout Injector Daemon
        env:
          LOOKINSIDE_INJECTOR_READ_TOKEN: ${{ secrets.LOOKINSIDE_INJECTOR_READ_TOKEN || secrets.LOOKINSIDE_WEB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${LOOKINSIDE_INJECTOR_READ_TOKEN}" ]]; then
            echo "LOOKINSIDE_INJECTOR_READ_TOKEN or LOOKINSIDE_WEB_RELEASE_TOKEN is required to checkout LookInside-Injector." >&2
            exit 1
          fi
          git clone --no-checkout \
            "https://x-access-token:${LOOKINSIDE_INJECTOR_READ_TOKEN}@github.com/LookInsideApp/LookInside-Injector.git" \
            ../LookInside-Injector
          git -C ../LookInside-Injector checkout --detach "${{ needs.prepare.outputs.injector_ref }}"
          [[ "$(git -C ../LookInside-Injector rev-parse HEAD)" == "${{ needs.prepare.outputs.injector_ref }}" ]]

      - name: Checkout MCP Server
        env:
          LOOKINSIDE_MCP_READ_TOKEN: ${{ secrets.LOOKINSIDE_PRIVATE_READ_TOKEN || secrets.LOOKINSIDE_WEB_RELEASE_TOKEN || secrets.LOOKINSIDE_INJECTOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${LOOKINSIDE_MCP_READ_TOKEN}" ]]; then
            echo "LOOKINSIDE_PRIVATE_READ_TOKEN, LOOKINSIDE_WEB_RELEASE_TOKEN, or LOOKINSIDE_INJECTOR_READ_TOKEN is required to checkout LookInside-MCP." >&2
            exit 1
          fi
          git clone --no-checkout \
            "https://x-access-token:${LOOKINSIDE_MCP_READ_TOKEN}@github.com/LookInsideApp/LookInside-MCP.git" \
            ../LookInside-MCP
          git -C ../LookInside-MCP checkout --detach "${{ needs.prepare.outputs.mcp_ref }}"
          [[ "$(git -C ../LookInside-MCP rev-parse HEAD)" == "${{ needs.prepare.outputs.mcp_ref }}" ]]

      - name: Configure Private Package Access
        env:
          LOOKINSIDE_PRIVATE_READ_TOKEN: ${{ secrets.LOOKINSIDE_PRIVATE_READ_TOKEN || secrets.LOOKINSIDE_WEB_RELEASE_TOKEN || secrets.LOOKINSIDE_INJECTOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${LOOKINSIDE_PRIVATE_READ_TOKEN}" ]]; then
            echo "LOOKINSIDE_PRIVATE_READ_TOKEN, LOOKINSIDE_WEB_RELEASE_TOKEN, or LOOKINSIDE_INJECTOR_READ_TOKEN is required for private SwiftPM packages." >&2
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${LOOKINSIDE_PRIVATE_READ_TOKEN}@github.com/LookInsideApp/".insteadOf \
            "https://github.com/LookInsideApp/"
          cat > ~/.netrc <<EOF
          machine github.com
            login x-access-token
            password ${LOOKINSIDE_PRIVATE_READ_TOKEN}
          EOF
          chmod 600 ~/.netrc

      - name: Generate Xcode Configuration
        run: |
          bash Scripts/write-github-action-xcconfig.sh \
            --version "${{ needs.prepare.outputs.build_version }}" \
            --build-number "${RELEASE_BUILD_NUMBER}"

      - name: Archive App
        timeout-minutes: 75
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOKINSIDE_RAW_XCODEBUILD_LOG: "1"
          PACKAGE_AUTH_PROVIDER: netrc
          PACKAGE_SCM_PROVIDER: xcode
        run: |
          bash Scripts/build-release-from-tag.sh \
            --tag "${{ needs.prepare.outputs.build_version }}" \
            --stage archive-app

      - name: Check Release Build For Debug Overrides
        run: |
          bash Scripts/check-host-release-clean.sh --release-strict \
            "build/releases/${{ needs.prepare.outputs.build_version }}/LookInside.xcarchive"

      - name: Package Unsigned Archive
        run: |
          set -euo pipefail
          release_dir="build/releases/${{ needs.prepare.outputs.build_version }}"
          tar -czf "${release_dir}/LookInside.xcarchive.tar.gz" \
            -C "${release_dir}" \
            LookInside.xcarchive

      - name: Scan Unsigned Archive For Private Keys
        run: |
          bash Scripts/scan-private-keys.sh \
            "build/releases/${{ needs.prepare.outputs.build_version }}/LookInside.xcarchive.tar.gz"

      - name: Upload Unsigned Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lookinside-${{ needs.prepare.outputs.build_version }}-unsigned
          path: build/releases/${{ needs.prepare.outputs.build_version }}/LookInside.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign_notarize_app:
    needs: [prepare, build_package]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer
      PRESERVE_KEYCHAIN_STATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lookinside-${{ needs.prepare.outputs.build_version }}-unsigned
          path: build/releases/${{ needs.prepare.outputs.build_version }}

      - name: Extract Unsigned Archive
        run: |
          set -euo pipefail
          release_dir="build/releases/${{ needs.prepare.outputs.build_version }}"
          tar -xzf "${release_dir}/LookInside.xcarchive.tar.gz" \
            -C "${release_dir}"

      - name: Setup Keychain and Signing Env
        id: setup_keychain
        env:
          KEYCHAIN_CONTENT_GZIP: ${{ secrets.KEYCHAIN_CONTENT_GZIP }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
        run: |
          bash Scripts/setup-ci-keychain.sh --output-file "${GITHUB_OUTPUT}"

      - name: Sign App
        timeout-minutes: 15
        env:
          SIGNING_IDENTITY: ${{ steps.setup_keychain.outputs.signing_identity }}
          DEVELOPMENT_TEAM: ${{ steps.setup_keychain.outputs.development_team }}
          KEYCHAIN_PATH: ${{ steps.setup_keychain.outputs.keychain_path }}
          KEYCHAIN_PROFILE: ${{ steps.setup_keychain.outputs.keychain_profile }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
        run: |
          bash Scripts/build-release-from-tag.sh \
            --tag "${{ needs.prepare.outputs.build_version }}" \
            --stage sign-app

      - name: Notarize App
        timeout-minutes: 30
        env:
          SIGNING_IDENTITY: ${{ steps.setup_keychain.outputs.signing_identity }}
          DEVELOPMENT_TEAM: ${{ steps.setup_keychain.outputs.development_team }}
          KEYCHAIN_PATH: ${{ steps.setup_keychain.outputs.keychain_path }}
          KEYCHAIN_PROFILE: ${{ steps.setup_keychain.outputs.keychain_profile }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
        run: |
          bash Scripts/build-release-from-tag.sh \
            --tag "${{ needs.prepare.outputs.build_version }}" \
            --stage notarize-app

      - name: Scan Notarized App For Private Keys And Debug Overrides
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_dir="build/releases/${{ needs.prepare.outputs.build_version }}"
          app_zips=("${release_dir}"/LookInside-*-macOS-app.zip)
          [[ ${#app_zips[@]} -gt 0 ]] || { echo "No notarized app zip to scan." >&2; exit 1; }
          bash Scripts/scan-private-keys.sh "${app_zips[@]}"
          bash Scripts/check-host-release-clean.sh --release-strict "${app_zips[@]}"

      - name: Upload Notarized App
        uses: actions/upload-artifact@v4
        with:
          name: lookinside-${{ needs.prepare.outputs.build_version }}-app
          path: build/releases/${{ needs.prepare.outputs.build_version }}/LookInside-*-macOS-app.zip
          if-no-files-found: error
          retention-days: 14

  collect_release:
    needs: [prepare, sign_notarize_app]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Release Scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: app
          sparse-checkout: Scripts
          persist-credentials: false

      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: lookinside-${{ needs.prepare.outputs.build_version }}-app
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 ./*.zip > checksums.txt

      - name: Scan Release Artifacts For Private Keys
        run: bash app/Scripts/scan-private-keys.sh dist

      - name: Upload Notarized Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Detect Existing GitHub Release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.build_version }}
        run: |
          set -euo pipefail
          if existing_target="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha' 2>/dev/null)"; then
            if [[ "$existing_target" != "${{ needs.prepare.outputs.source_ref }}" ]]; then
              echo "Existing tag $RELEASE_TAG points at $existing_target, not ${{ needs.prepare.outputs.source_ref }}." >&2
              exit 1
            fi
          fi
          error_file="$RUNNER_TEMP/release-state-error.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --silent 2>"$error_file"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(<"$error_file")" == *"HTTP 404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$error_file" >&2
          exit 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.LOOKINSIDE_WEB_RELEASE_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.build_version }}
          target_commitish: ${{ needs.prepare.outputs.source_ref }}
          generate_release_notes: ${{ steps.release_state.outputs.exists != 'true' }}
          files: |
            dist/*.zip
            dist/checksums.txt

  publish_appcast:
    needs: [prepare, collect_release]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer

    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: app
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: dist

      - name: Resolve App Zip
        id: artifact
        run: |
          set -euo pipefail
          app_zip="$(find dist -maxdepth 1 -type f -name 'LookInside-*-macOS-app.zip' -print -quit)"
          if [[ -z "$app_zip" ]]; then
            echo "No LookInside app zip found in release artifact." >&2
            exit 1
          fi
          echo "app_zip=$app_zip" >> "$GITHUB_OUTPUT"

      - name: Validate Sparkle Publishing Secrets
        env:
          LOOKINSIDE_WEB_RELEASE_TOKEN: ${{ secrets.LOOKINSIDE_WEB_RELEASE_TOKEN }}
          LOOKINSIDE_SECRETS_READ_TOKEN: ${{ secrets.LOOKINSIDE_SECRETS_READ_TOKEN }}
          SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE: ${{ secrets.SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$LOOKINSIDE_WEB_RELEASE_TOKEN" ]] || { echo "LOOKINSIDE_WEB_RELEASE_TOKEN secret is required." >&2; exit 1; }
          [[ -n "$LOOKINSIDE_SECRETS_READ_TOKEN" ]] || { echo "LOOKINSIDE_SECRETS_READ_TOKEN secret is required." >&2; exit 1; }
          [[ -n "$SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE" ]] || { echo "SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE secret is required." >&2; exit 1; }

      - name: Checkout Web Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.WEB_TARGET_REPO }}
          ref: main
          path: web
          token: ${{ secrets.LOOKINSIDE_WEB_RELEASE_TOKEN }}

      - name: Checkout Secrets Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SECRETS_SOURCE_REPO }}
          ref: main
          path: secrets
          token: ${{ secrets.LOOKINSIDE_SECRETS_READ_TOKEN }}
          sparse-checkout: sparkle
          sparse-checkout-cone-mode: true
          filter: blob:none
          persist-credentials: false

      - name: Export GitHub Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ needs.prepare.outputs.build_version }}" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body // ""' > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -f "$RUNNER_TEMP/release-notes.md" || ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            printf '# LookInside %s\n\nSparkle update build.\n' "${{ needs.prepare.outputs.build_version }}" > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Decrypt Sparkle Private Key
        env:
          SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE: ${{ secrets.SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SPARKLE_PRIVATE_KEY_GPG_PASSPHRASE" \
            --decrypt secrets/sparkle/private-ed-key.txt.gpg > "$RUNNER_TEMP/sparkle-private-ed-key.txt"
          chmod 600 "$RUNNER_TEMP/sparkle-private-ed-key.txt"

      - name: Install Sparkle Tools
        id: sparkle
        run: |
          set -euo pipefail
          tools_dir="$(bash app/Scripts/install-sparkle-tools.sh --version 2.9.1)"
          echo "tools_dir=$tools_dir" >> "$GITHUB_OUTPUT"

      - name: Publish Appcast Into Web Repository
        env:
          PRUNE_APPCAST_VERSIONS: ""
          PRUNE_APPCAST_DELTAS: "false"
          ASSET_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.build_version }}/LookInside-${{ needs.prepare.outputs.build_version }}-macOS-app.zip
        run: |
          set -euo pipefail
          bash app/Scripts/publish-sparkle-appcast-to-web.sh \
            --web-dir web \
            --app-zip "${{ steps.artifact.outputs.app_zip }}" \
            --private-key-file "$RUNNER_TEMP/sparkle-private-ed-key.txt" \
            --sparkle-tools-dir "${{ steps.sparkle.outputs.tools_dir }}" \
            --release-notes-file "$RUNNER_TEMP/release-notes.md" \
            --version "${{ needs.prepare.outputs.build_version }}" \
            --asset-download-url "$ASSET_DOWNLOAD_URL"

      - name: Scan Web Changes For Private Keys
        run: |
          set -euo pipefail
          bash app/Scripts/scan-private-keys.sh web/public
          sparkle_key="$(tr -d '[:space:]' <"$RUNNER_TEMP/sparkle-private-ed-key.txt")"
          [[ -n "$sparkle_key" ]] || { echo "Decrypted Sparkle private key is empty." >&2; exit 1; }
          if grep -rqF -- "$sparkle_key" web; then
            echo "The Sparkle private key was written into the Web repository." >&2
            exit 1
          fi

      - name: Remove Sparkle Private Key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private-ed-key.txt"

      - name: Commit Web Appcast
        working-directory: web
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/appcast.xml public/downloads/manifest.json public/downloads/lookinside
          if git diff --cached --quiet; then
            echo "No Web appcast changes to publish."
            exit 0
          fi
          git commit -m "Publish LookInside ${{ needs.prepare.outputs.build_version }} appcast"
          git push origin HEAD:main
